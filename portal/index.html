<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGRSA Member Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#141a4f;--navy-2:#1e2670;--ink:#0b0f30;--red:#e41f29;--red-2:#ff6b72;--gold:#f2b544;--green:#1f9d55;--amber:#c27c0e;--blue:#2563eb;
--bg:#f4f5fa;--card:#fff;--line:#e3e5ef;--text:#171a33;--muted:#5d6280;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:15px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;letter-spacing:.3px}
button,input,select,textarea{font:inherit}
a{color:var(--blue)}
.proto-bar{background:#fff7e0;color:#6b4b00;font-size:.8rem;text-align:center;padding:6px 10px;border-bottom:1px solid #f1dfaa}
.proto-bar b{font-weight:700}.proto-bar button{background:none;border:0;color:#6b4b00;text-decoration:underline;cursor:pointer;font-size:.8rem;margin-left:8px}
/* login */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-side{background:linear-gradient(160deg,var(--navy-2),var(--ink));color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-side:before{content:"";position:absolute;inset:auto -120px -160px auto;width:420px;height:420px;border-radius:50%;border:40px solid rgba(228,31,41,.18)}
.login-side .brand{display:flex;gap:14px;align-items:center}
.login-side .brand img{width:64px;height:64px;border-radius:50%;background:#fff;padding:3px}
.login-side .brand b{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-size:1.5rem;text-transform:uppercase;line-height:1.05;display:block}
.login-side .brand span{opacity:.7;font-size:.82rem}
.login-side h1{font-size:clamp(2.2rem,4vw,3.4rem);text-transform:uppercase;line-height:1;margin:40px 0 14px}
.login-side h1 em{font-style:normal;color:var(--red-2)}
.login-side p{opacity:.8;max-width:430px}
.login-side ul{list-style:none;margin-top:26px;display:grid;gap:10px;opacity:.9;font-size:.92rem}
.login-side li:before{content:"✓";color:var(--gold);font-weight:700;margin-right:10px}
.login-main{display:flex;align-items:center;justify-content:center;padding:40px 22px}
.login-card{width:100%;max-width:420px}
.login-card h2{font-size:2rem;text-transform:uppercase}
.login-card .sub{color:var(--muted);margin:4px 0 22px}
.demo{margin-top:22px;border:1px dashed #c9cde0;border-radius:12px;padding:14px;font-size:.84rem;color:var(--muted)}
.demo b{color:var(--text)}.demo button{display:block;width:100%;text-align:left;background:#f7f8fc;border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-top:8px;cursor:pointer;font-size:.84rem}
.demo button:hover{border-color:var(--navy)}
/* forms */
label.f{display:block;font-size:.84rem;font-weight:600;margin-bottom:14px}
label.f small{font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-size:.95rem}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,38,112,.12)}
.f input[disabled],.f select[disabled]{background:#f2f3f8;color:#555}
.f .err-t{color:var(--red);font-weight:500;font-size:.8rem;margin-top:5px;display:none}
.f.bad input,.f.bad select{border-color:var(--red)}.f.bad .err-t{display:block}
.grid2>*,.grid3>*{min-width:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;font-size:.92rem;text-decoration:none;white-space:nowrap}
.btn-p{background:var(--red);color:#fff}.btn-p:hover{background:#c8121c}
.btn-n{background:var(--navy);color:#fff}.btn-n:hover{background:var(--navy-2)}
.btn-g{background:#fff;color:var(--text);border:1.5px solid var(--line)}.btn-g:hover{border-color:var(--navy)}
.btn-ok{background:var(--green);color:#fff}.btn-x{background:#fff;color:var(--red);border:1.5px solid #f3c2c5}
.btn-s{padding:7px 12px;font-size:.82rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-block{width:100%}
.alert{border-radius:10px;padding:11px 14px;font-size:.87rem;margin-bottom:16px}
.alert-r{background:#fdecee;color:#8f141b}.alert-a{background:#fff6e0;color:#7a5200}.alert-g{background:#e7f6ee;color:#11603a}.alert-b{background:#eaf0ff;color:#1c3c94}
/* app shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 31px)}
.side{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:calc(100vh - 31px);overflow:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.side .brand img{width:42px;height:42px;border-radius:50%;background:#fff;padding:2px}
.side .brand b{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-size:1.15rem;text-transform:uppercase;line-height:1}
.side .brand span{display:block;font-size:.7rem;opacity:.65;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.side nav a{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.78);text-decoration:none;padding:10px 12px;border-radius:9px;font-weight:500;font-size:.92rem;margin-bottom:2px;cursor:pointer}
.side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav a.on{background:rgba(228,31,41,.16);color:#fff;box-shadow:inset 3px 0 0 var(--red)}
.side nav a .n{background:var(--red);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 8px;font-weight:700}
.side .who{margin-top:22px;padding:14px 12px;border-top:1px solid rgba(255,255,255,.1);font-size:.82rem;opacity:.85}
.side .who button{margin-top:10px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:7px 12px;cursor:pointer;width:100%}
.main{padding:30px 34px 60px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:2.1rem;text-transform:uppercase;line-height:1}
.ph p{color:var(--muted);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:1.3rem;text-transform:uppercase;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat small{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.stat .muted{display:block;margin-top:2px}.stat b{display:block;font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-size:2.1rem;line-height:1.1;margin-top:4px}
.stat.hl{border-color:#f1d08a;background:#fffaf0}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;background:#f7f8fc;color:var(--muted);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.6px;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #eef0f6;vertical-align:top}
tr:last-child td{border-bottom:0}
td .muted,.muted{color:var(--muted);font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap}
.chip:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.c-unpaid{background:#eef0f5;color:#4b5068}.c-pending{background:#fff3d6;color:#8a5a00}.c-paid{background:#e2f5ea;color:#11703f}
.c-rejected{background:#fde5e7;color:#a3141c}.c-offline{background:#e5edff;color:#1d47b8}.c-off{background:#eef0f5;color:#777}
.tag{display:inline-block;background:#eef0f8;border-radius:6px;padding:2px 7px;font-size:.75rem;margin:2px 3px 2px 0;font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.filters select,.filters input{padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:.86rem}
.filters input{min-width:220px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,15,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;padding:26px;position:relative}
.modal.sm{max-width:480px}
.modal h2{font-size:1.7rem;text-transform:uppercase;margin-bottom:4px}
.modal .x{position:absolute;right:16px;top:14px;background:none;border:0;font-size:1.5rem;cursor:pointer;color:var(--muted)}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
/* registration */
.steps{display:flex;gap:6px;margin:14px 0 22px}
.steps span{flex:1;height:5px;border-radius:5px;background:#e6e8f2}.steps span.on{background:var(--red)}
.sec-t{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;text-transform:uppercase;font-size:1.15rem;margin:8px 0 12px;color:var(--navy)}
.races{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.race{border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:.9rem;background:#fff}
.race input{margin-top:3px;accent-color:var(--red)}
.race small{display:block;color:var(--muted);font-size:.75rem}
.race.on{border-color:var(--red);background:#fff5f5}
.race.dis{opacity:.45;cursor:not-allowed}
.rule{display:flex;justify-content:space-between;align-items:center;background:#f6f7fb;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:.87rem}
.rule b{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-size:1.2rem}
.decl{display:flex;gap:12px;background:#f7f8fc;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:.88rem;cursor:pointer}
.decl input{margin-top:3px;width:18px;height:18px;accent-color:var(--red);flex:none}
.review{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:.9rem}
.review dt{color:var(--muted)}
.upload{border:1.5px dashed #c5c9dc;border-radius:12px;padding:16px;text-align:center;font-size:.86rem;color:var(--muted);background:#fafbfe}
.upload b{color:var(--text)}
/* payment */
.pay{display:grid;grid-template-columns:300px 1fr;gap:22px}
.qr{border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;background:#fff}
.qr svg{width:100%;max-width:230px;height:auto}
.qr .stamp{display:inline-block;margin-top:10px;background:#fde5e7;color:#a3141c;font-weight:700;font-size:.75rem;letter-spacing:.6px;padding:4px 10px;border-radius:6px}
.amt{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-size:2.6rem;line-height:1}
.sumrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff}
.check.on{border-color:var(--navy);background:#f5f6ff}
.check input{accent-color:var(--navy);width:17px;height:17px}
/* payment queue */
.pq{display:grid;gap:14px}
.pq .card{display:grid;grid-template-columns:1fr auto;gap:16px}
.flag{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:6px;background:#fde5e7;color:#a3141c;margin:0 6px 6px 0}
.flag.info{background:#eef0f5;color:#4b5068}.flag.ok{background:#e2f5ea;color:#11703f}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.kv div{background:#f7f8fc;border-radius:9px;padding:8px 10px}
.kv small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
.kv b{font-size:.92rem;word-break:break-all}
.receipt{width:120px;height:150px;border-radius:10px;border:1px solid var(--line);background:linear-gradient(#f2f3f8,#e6e8f2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:.72rem;color:var(--muted);padding:8px;cursor:pointer}
.kid{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--navy-2),var(--red));color:#fff;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-size:1.4rem;font-weight:700}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:.9rem;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.mob-top{display:none}
.tabs2{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs2 button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.84rem}
.tabs2 button.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (max-width:980px){.stats{grid-template-columns:1fr 1fr}.pay{grid-template-columns:1fr}.kv{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
 .login-wrap{grid-template-columns:1fr}.login-side{padding:28px 22px}.login-side h1{margin:22px 0 8px;font-size:2rem}.login-side ul{display:none}.login-side:before{display:none}
 .shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:12px}
 .side .brand{padding:0 4px 10px;margin-bottom:8px}.side nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
 .side nav a{white-space:nowrap;margin:0;padding:8px 12px;font-size:.85rem}.side nav a.on{box-shadow:inset 0 -3px 0 var(--red)}
 .side .who{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:10px 4px 0}.side .who button{width:auto;margin:0}
 .main{padding:20px 14px 50px}.ph h1{font-size:1.7rem}.grid2,.grid3{grid-template-columns:1fr}.review{grid-template-columns:1fr}.review dt{margin-top:6px}
 .pq .card{grid-template-columns:1fr}.modal{padding:20px 16px}
}
.cert{container-type:inline-size;position:relative;width:100%;aspect-ratio:297/210;background:#fff;color:#171a33;overflow:hidden;border-radius:6px;box-shadow:0 6px 24px rgba(11,15,48,.12)}
.cert .frame{position:absolute;inset:2.2cqw;border:.5cqw solid var(--navy);outline:.18cqw solid var(--gold);outline-offset:-1.1cqw;padding:3cqw 5cqw;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .band{position:absolute;left:0;right:0;top:0;height:1.1cqw;background:linear-gradient(90deg,#f07a22 33%,#fff 33% 66%,#1f9d55 66%)}
.cert img.lg{width:9cqw;height:9cqw}
.cert .org{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-weight:800;text-transform:uppercase;font-size:3.1cqw;color:var(--navy);line-height:1.05;margin-top:.8cqw}
.cert .aff{font-size:1.25cqw;color:#5d6280;letter-spacing:.08cqw}
.cert .ttl{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-weight:800;text-transform:uppercase;font-size:4.4cqw;letter-spacing:.3cqw;color:var(--red);margin:1.4cqw 0 .4cqw;line-height:1}
.cert .lead{font-size:1.45cqw;color:#5d6280}
.cert .nm{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:4.2cqw;color:var(--navy);border-bottom:.15cqw solid var(--gold);padding:0 3cqw .3cqw;margin:.8cqw 0}
.cert .txt{font-size:1.5cqw;line-height:1.55;max-width:80cqw}
.cert table{width:auto;margin:1.2cqw auto 0;font-size:1.35cqw;border-collapse:collapse}
.cert th,.cert td{padding:.45cqw 1.6cqw;border-bottom:.08cqw solid #e3e5ef;text-align:left;font-size:1.35cqw}
.cert th{background:none;font-size:1.05cqw;letter-spacing:.1cqw}
.cert .medal{font-weight:700}.cert .Gold{color:#a87a00}.cert .Silver{color:#6b7280}.cert .Bronze{color:#a0522d}
.cert .sig{position:absolute;bottom:3.8cqw;left:7cqw;right:7cqw;display:flex;justify-content:space-between;align-items:flex-end;font-size:1.25cqw}
.cert .sig div{width:20cqw;border-top:.12cqw solid #171a33;padding-top:.5cqw;text-align:center}
.cert .no{position:absolute;top:3.6cqw;right:4.5cqw;border:.15cqw solid var(--navy);border-radius:.8cqw;padding:.4cqw 1.2cqw;font-size:1.1cqw;text-align:center;line-height:1.2}
.cert .no b{display:block;font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-size:2.6cqw;color:var(--navy)}
.cert .sample{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14cqw;font-weight:800;color:rgba(228,31,41,.06);transform:rotate(-18deg);pointer-events:none}
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr));gap:18px}
#print-area{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #c9cde0;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.thanks{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:44px 24px 34px;text-align:center;max-width:760px;margin:10px auto;overflow:hidden}
.thanks .band{position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#f07a22 33%,#fff 33% 66%,#1f9d55 66%)}
.thanks img{width:96px;height:96px;border-radius:50%;box-shadow:0 8px 24px rgba(20,26,79,.18)}
.thanks .kick{display:block;margin-top:16px;color:var(--green);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:.78rem}
.thanks h2{font-size:2.4rem;text-transform:uppercase;line-height:1.05;margin:6px 0 10px;color:var(--navy)}
.thanks .ev{color:var(--muted)}.thanks .ev b{color:var(--text)}
.thanks .kv{grid-template-columns:repeat(2,1fr)!important}.thanks .kv b{white-space:nowrap}
.thanks .who{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}.thanks .who span{background:#eef0f8;border-radius:999px;padding:5px 12px;font-weight:600;font-size:.86rem}
.rsheet{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:16px}
.rs-top{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,var(--navy-2),var(--ink));color:#fff;padding:18px 22px;border-bottom:4px solid var(--gold)}
.rs-top img{width:56px;height:56px;border-radius:50%;background:#fff;padding:2px}
.rs-org{font-family:"Barlow Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:1.35rem;text-transform:uppercase;line-height:1}
.rs-ev{opacity:.8;font-size:.85rem;margin-top:4px}
.rs-title{text-align:center;padding:18px 16px 6px}.rs-title span{font-size:.75rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);font-weight:700}
.rs-title h2{font-size:2rem;text-transform:uppercase;line-height:1.1;margin:4px 0}.rs-title b{color:var(--muted);font-weight:600}
.rs-pod{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px 22px}
.rs-pod .p{border-radius:14px;padding:14px;text-align:center;border:1px solid var(--line);position:relative}
.rs-pod .p i{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:#fff;margin-bottom:6px}
.rs-pod .p b{display:block;font-size:1rem}.rs-pod .p span{display:block;font-size:.78rem;color:var(--muted)}.rs-pod .p em{display:block;font-style:normal;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.5rem;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.rs-pod .Gold{background:#fff8e1;border-color:#f2cf6b}.rs-pod .Gold i{background:#c99a06}.rs-pod .Silver{background:#f3f4f7;border-color:#c9ccd6}.rs-pod .Silver i{background:#7b8191}.rs-pod .Bronze{background:#fbefe6;border-color:#e2b48f}.rs-pod .Bronze i{background:#a0582d}
.rs-tbl{width:calc(100% - 44px);margin:6px 22px 0}.rs-tbl td.pos{font-weight:800;text-align:center;width:44px}.rs-tbl td.tm{font-variant-numeric:tabular-nums;font-weight:600}
.rs-tbl tr.pod-Gold td.pos{color:#a87a00}.rs-tbl tr.pod-Silver td.pos{color:#6b7280}.rs-tbl tr.pod-Bronze td.pos{color:#a0522d}.rs-tbl tr.el td{color:#5d6280}
.rs-sub{background:#f7f8fc;font-size:.75rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.medal-chip{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px}.medal-chip.Gold{background:#fff3c4;color:#8a6400}.medal-chip.Silver{background:#eceef3;color:#4b5263}.medal-chip.Bronze{background:#f8e3d4;color:#8a4420}
.rs-foot{display:flex;justify-content:space-between;padding:14px 22px 18px;font-size:.78rem;color:var(--muted)}
@media (max-width:820px){.rs-pod{grid-template-columns:1fr}.rs-tbl{width:100%;margin:0;font-size:.8rem}.on-screen .rs-tbl th:nth-child(5),.on-screen .rs-tbl td:nth-child(5){display:none}}
@media print{body.print-certs{background:#fff}body.print-certs .rsheet{border:0;border-radius:0;margin:0;page-break-after:always;break-after:page}
 body.print-certs .rs-top{padding:12px 16px}body.print-certs .rs-top img{width:44px;height:44px}body.print-certs .rs-org{font-size:1.1rem}body.print-certs .rs-ev{font-size:.72rem}
 body.print-certs .rs-title{padding:10px 10px 2px}body.print-certs .rs-title h2{font-size:1.5rem}body.print-certs .rs-title b{font-size:.8rem}
 body.print-certs .rs-pod{padding:8px 16px;gap:8px;grid-template-columns:repeat(3,1fr)!important}body.print-certs .rs-pod .p{padding:8px}body.print-certs .rs-pod .p i{width:24px;height:24px;font-size:.8rem;margin-bottom:2px}
 body.print-certs .rs-pod .p b{font-size:.85rem}body.print-certs .rs-pod .p span{font-size:.66rem}body.print-certs .rs-pod .p em{font-size:1.15rem}
 body.print-certs .rs-tbl{width:calc(100% - 32px);margin:4px 16px 0}body.print-certs .rs-tbl th{padding:6px 6px;font-size:.6rem}
 body.print-certs .rs-tbl td{padding:4px 6px;font-size:.72rem;line-height:1.3}body.print-certs .rs-foot{padding:8px 16px;font-size:.66rem}body.print-certs .rsheet .rs-top,body.print-certs .rs-pod .p{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media print{body.print-certs #app,body.print-certs .proto-bar,body.print-certs #modal-root,body.print-certs .toast{display:none!important}
 body.print-certs #print-area{display:block}body.print-certs .cert{width:297mm;height:210mm;aspect-ratio:auto;box-shadow:none;border-radius:0;page-break-after:always;break-after:page}
 }
@page cert{size:A4 landscape;margin:0}
@page{size:A4 portrait;margin:8mm}
@media print{body.print-certs .cert{page:cert}}
@media print{.side,.proto-bar,.filters,.ph .rowflex,.btn,.no-print{display:none!important}.shell{display:block}.main{padding:0}
 body.print-sheet .main>*:not(.sheet){display:none!important}body.print-sheet .sheet{border:0;padding:0}}
@media (max-width:980px){.stats[style]{grid-template-columns:1fr 1fr!important}}
@media (max-width:820px){.card [style*="grid-template-columns:190px"]{grid-template-columns:110px 1fr 36px!important}}
.saving{position:fixed;right:16px;bottom:16px;background:var(--navy);color:#fff;border-radius:99px;padding:8px 14px;font-size:.82rem;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.qr-soon{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;border:2px dashed #c9cde0;border-radius:12px;padding:18px;color:var(--muted);font-size:.9rem;background:#fafbff}
.qr-soon b{color:var(--navy);font-size:1.05rem}
.keybox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:2px;background:#f4f5fa;border:1px solid var(--line);border-radius:10px;padding:12px;word-break:break-all;text-align:center;margin:10px 0}
</style>

function payFlags(p) {
  const f = [];
  if (!p.utr) f.push("Missing UTR");
  if (p.amount < p.expected) f.push(`Short by ${inr(p.expected - p.amount)}`);
  if (p.amount > p.expected) f.push(`Overpaid by ${inr(p.amount - p.expected)}`);
  if (p.utr && DB.payments.some((q) => q.id !== p.id && q.utr === p.utr && q.status !== "rejected")) f.push("UTR already used");
  return f;
}

/* ================= RESULTS: heats → best N → final ================= */
const gkey = (e, x, a, g) => [e, x, a, g].join("|");
function heatPlan(n, x) {

  if (/Elimination|Points/.test(nm)) { if (n <= 30) return [{ name: "Final", size: 60 }]; const h = Math.ceil(n / 30); return [{ name: "Qualifying heats", size: Math.ceil(n / h), adv: 10, perHeat: true }, { name: "Final", size: 60 }]; }
  if (n <= 8) return [{ name: "Final", size: 8 }];
  const q = n <= 16 ? 8 : n <= 64 ? 16 : 24, plan = [{ name: "Heats", size: 8, adv: q }];
  if (q > 16) plan.push({ name: "Quarter final", size: 8, adv: 16 });

  plan.push({ name: "Final", size: 8 });

}

  const m = v.match(/^(?:(\d+):)?(\d{1,2}(?:\.\d{1,3})?)$/); if (!m) return undefined; return Math.round(((+m[1] || 0) * 60 + +m[2]) * 1000); }

        DB.regs.push(r); log(`Registered ${s.name} for ${e.name} ${cash ? " · paid offline" : ""}`); save();

  draw();

function dummyQR() {

  return `<div class="qr-soon"><b>Payment details will be shared soon</b><span>The official CGRSA UPI QR code will appear here. You can register now and pay later from “Pay fees”.</span></div>`;
}
/* Prototype check: is this a phone screenshot (tall, flat app colours) rather than a camera photo or document?
   The real portal also reads the text (OCR) and only accepts it if it shows the UTR and amount entered. */
function checkShot(file) {
  return new Promise((res) => {
    if (!/^image\/(png|jpe?g)$/.test(file.type)) return res({ ok: false, msg: "Only JPG or PNG screenshots are accepted." });
    if (file.size > 5 * 1024 * 1024) return res({ ok: false, msg: "The image is larger than 5 MB." });
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => res({ ok: false, msg: "This file couldn’t be opened as an image." });
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      if (h / w < 1.4) return res({ ok: false, msg: "This doesn’t look like a phone payment screenshot. Upload the payment success screen from your UPI app." });
      const c = document.createElement("canvas"), cw = 200, ch = Math.round(60 * h / w); c.width = cw; c.height = ch;
      const x = c.getContext("2d"); x.drawImage(img, 0, 0, cw, ch);
      const d = x.getImageData(0, 0, cw, ch).data, counts = {};
      for (let i = 0; i < d.length; i += 4) { const k = (d[i] >> 4) + "," + (d[i + 1] >> 4) + "," + (d[i + 2] >> 4); counts[k] = (counts[k] || 0) + 1; }
      const top = Object.values(counts).sort((a, b) => b - a).slice(0, 3).reduce((a, b) => a + b, 0) / (cw * ch);
      if (top < 0.6) return res({ ok: false, msg: "This looks like a photo, not a payment screenshot. Upload the payment success screen from your UPI app." });
      const tw = Math.min(900, w), t = document.createElement("canvas"); t.width = tw; t.height = Math.round(tw * h / w); t.getContext("2d").drawImage(img, 0, 0, t.width, t.height);
      res({ ok: true, name: file.name, thumb: t.toDataURL("image/jpeg", 0.82) });
    };
    img.src = url;
  });
}
function readShot(amount) {
  return new Promise((res) => setTimeout(() => {
    let utr; do { utr = "4026" + String(Math.floor(Math.random() * 1e8)).padStart(8, "0"); } while (DB.payments.some((p) => p.utr === utr) || (DB.objections || []).some((o) => o.utr === utr));
    const d = new Date(Date.now() - 4 * 60e3), pad = (n) => String(n).padStart(2, "0");
    res({ utr, nm: ME.name, amt: amount, dt: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}` });
  }, 1100));
}

    if (amt !== total) {
      const m = modal(`<h2>Amount doesn’t match</h2><p style="margin-top:8px">You entered <b>${inr(amt)}</b>, but the fee due for ${sel.length} skater${sel.length > 1 ? "s" : ""} is <b>${inr(total)}</b>.</p>
        <div class="alert alert-a" style="margin-top:14px">If you paid a different amount, submit anyway. The CGRSA office will check it, and the registrations stay unpaid until the full fee is verified.</div>
        <div class="foot"><button class="btn btn-g" data-c>Fix amount</button><button class="btn btn-n" data-s>Submit anyway</button></div>`, "sm");
      $("[data-c]", m).onclick = closeModal; $("[data-s]", m).onclick = go2;
    } else go2();
  };
}

$("#app").innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted)">Loading the CGRSA portal…</div>`;
pull(true).then(() => { if (ME) VIEW = "home"; render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && ME && !$("#modal-root").innerHTML && !document.activeElement?.matches("input,textarea,select")) pull().then((c) => c && render()); });
</script>
</body>
</html>
